<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>대구 그리드별 시간대별 유동인구</title>
    <link rel="stylesheet" href="node_modules/@yadoran-2025/booong-design-system/dist/booong.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-stage" aria-label="대구 그리드별 시간대별 유동인구 지도">
        <header class="topbar">
          <div>
            <p class="eyebrow">Daegu Floating Population Grid</p>
            <h1>대구 그리드별 시간대별 유동인구</h1>
          </div>
          <div class="selected-dong" aria-live="polite">
            <span>선택 행정동</span>
            <strong id="selectedDong">지도를 클릭하세요</strong>
          </div>
        </header>

        <div class="map-wrap">
          <canvas id="mapCanvas" aria-label="행정동 경계 위 그리드 유동인구 지도"></canvas>
          <div class="tooltip" id="tooltip" role="status"></div>
          <div class="legend" aria-label="유동인구 색상 범례">
            <div class="legend-title">그리드 유동인구</div>
            <div class="legend-items" id="legendItems"></div>
          </div>
        </div>

        <footer class="timebar" aria-label="시간대 선택">
          <div class="time-readout">
            <span>현재 시간</span>
            <strong id="hourLabel">00시</strong>
          </div>
          <input id="hourRange" type="range" min="0" max="23" step="1" value="0" aria-label="시간대" />
          <div class="hour-ticks" aria-hidden="true">
            <span>00</span>
            <span>06</span>
            <span>12</span>
            <span>18</span>
            <span>23</span>
          </div>
        </footer>
      </section>

      <aside class="info-panel" aria-label="지도 요약 정보">
        <section class="metric-block">
          <span>최대 그리드</span>
          <strong id="maxGrid">-</strong>
        </section>
        <section class="metric-block">
          <span>선택 행정동</span>
          <strong id="panelDong">-</strong>
        </section>
        <section class="notes">
          <h2>색상 기준</h2>
          <p>모든 시간대에 같은 절대 범위를 적용합니다. 슬라이더를 움직여도 같은 인구 구간은 같은 색으로 표시됩니다.</p>
        </section>
      </aside>
    </main>

    <script src="data/daegu-admin-boundaries.js"></script>
    <script src="data/daegu-grid-flow.js"></script>
    <script src="app.js"></script>
  </body>
</html>
